<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>NoRush.GG – odtwarzacz</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#p{width:100%;height:100%}</style>
</head>
<body>
<!--
  NoRush.GG: strona pośrednia dla teledysków YouTube na ekranie ładowania.
  YouTube nie odtwarza filmów osadzonych bezpośrednio w ekranie ładowania FiveM (brak adresu strony).
  Ta strona ma normalny adres https, więc YouTube ją wpuszcza. Wystaw ją za darmo na GitHub Pages
  (instrukcja w INSTRUKCJA-YOUTUBE.txt) i wpisz jej adres w config.js jako youtubeProxy.
-->
<div id="p"></div>
<script>
(function () {
  var q = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ''); });
  var id = /^[A-Za-z0-9_-]{11}$/.test(q.v || '') ? q.v : null;
  var start = parseInt(q.s, 10) || 0;
  var vol = Math.max(0, Math.min(100, parseInt(q.vol, 10)));
  if (isNaN(vol)) vol = 35;
  var player = null;

  function send(ev, extra) {
    var msg = { nr: 'yt', ev: ev };
    for (var k in extra || {}) msg[k] = extra[k];
    try { parent.postMessage(msg, '*'); } catch (e) {}
  }
  if (!id) { send('error'); return; }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      width: '100%', height: '100%', videoId: id,
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, rel: 0, playsinline: 1, start: start },
      events: {
        onReady: function () {
          try { player.setVolume(vol); if (vol > 0) player.unMute(); else player.mute(); player.playVideo(); } catch (e) {}
          send('ready');
          // dźwięk zablokowany: gramy wyciszone, ekran ładowania poprosi o klik
          setTimeout(function () {
            var st = player.getPlayerState ? player.getPlayerState() : -1;
            if (st !== 1 && st !== 3) { try { player.mute(); player.playVideo(); } catch (e) {} }
          }, 2500);
        },
        onStateChange: function (e) {
          if (e.data === 1) {
            var d = player.getVideoData ? player.getVideoData() : {};
            send('playing', { title: d.title || '', muted: player.isMuted ? player.isMuted() : false });
          } else if (e.data === 2) send('paused');
          else if (e.data === 0) send('ended');
        },
        onError: function () { send('error'); }
      }
    });
  };

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.nr !== 'cmd' || !player) return;
    try {
      if (d.c === 'play') player.playVideo();
      else if (d.c === 'pause') player.pauseVideo();
      else if (d.c === 'vol') { player.setVolume(d.v); if (d.v > 0) player.unMute(); else player.mute(); }
    } catch (err) {}
  });

  setInterval(function () {
    if (player && player.getDuration) { try { send('time', { cur: player.getCurrentTime(), dur: player.getDuration() }); } catch (e) {} }
  }, 500);

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function () { send('error'); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
